name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: schema_test
          POSTGRES_PASSWORD: ci-schema-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCHEMA_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=schema_test;Password=ci-schema-test-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SchoolAdmission.slnx

      - name: Restore local EF Core tool
        run: dotnet tool restore

      - name: Build
        run: dotnet build SchoolAdmission.slnx --configuration Release --no-restore

      - name: Check migration snapshot
        env:
          ConnectionStrings__DefaultConnection: ${{ env.SCHEMA_TEST_CONNECTION_STRING }}
        run: dotnet ef migrations has-pending-model-changes --project Backend/SchoolAdmission.Api --configuration Release --no-build

      # Database tests own isolated databases, including hold-creation concurrency cases.
      - name: Run tests
        run: dotnet test SchoolAdmission.slnx --configuration Release --no-build --no-restore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build --file Backend/SchoolAdmission.Api/Dockerfile --tag school-admission-api:ci .

      - name: Build frontend image
        run: docker build --tag school-admission-frontend:ci Frontend
